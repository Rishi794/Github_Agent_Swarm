name: Multi-Agent Swarm (Ollama, single-pass)

# Lightweight alternative to `Multi-Agent Debate Swarm (llama.cpp + sqlite-vec)`.
# Same fan-out / fan-in branch topology, but one inference per agent against a
# locally served Ollama model instead of a multi-round llama.cpp debate:
#
#   main              -> orchestration (this file + agents/*.py)
#   agent-state/<id>  -> per-agent findings (collision-free single writer each)
#   central-storage   -> knowledge_base.json + SWARM_REPORT.md
#
# Use this when you want fast, cheap runs; use the debate workflow when you want
# agents to critique each other across multiple rounds with vector memory.

on:
  workflow_dispatch:
    inputs:
      # NOTE: manual-only on purpose. `schedule` events do NOT receive workflow_dispatch
      # input defaults, so a cron trigger here would need `||` fallbacks on every input.
      # The debate workflow is the scheduled one.
      task_prompt:
        description: 'Task or research question; leave EMPTY to use the task defined in system_prompt.md'
        required: false
        default: ''
      pareto_model:
        description: 'Model tag (qwen3:8b / qwen3:14b for standard runners, qwen3.5:35b-a3b for 32GB+ runners)'
        required: true
        default: 'qwen3:8b'

permissions:
  contents: write

concurrency:
  group: swarm-ollama
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1: Parallel agents, each writing to its own branch
  # =========================================================================
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        agent_id: [researcher, security_auditor, synthesizer]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Task Prompt (dispatch input > system_prompt.md)
        id: task_prompt
        env:
          INPUT_TASK_PROMPT: ${{ inputs.task_prompt }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TASK_PROMPT//[[:space:]]/}" ]; then
            SOURCE="workflow_dispatch input"
            printf '%s\n' "$INPUT_TASK_PROMPT" > /tmp/task_prompt.txt
          elif [ -f system_prompt.md ]; then
            SOURCE="system_prompt.md"
            # Strip HTML comments so author notes never reach the model.
            python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("system_prompt.md").read_text(encoding="utf-8")
          text = re.sub(r"<!--.*?-->", "", text, flags=re.DOTALL)
          text = re.sub(r"\n{3,}", "\n\n", text).strip()
          pathlib.Path("/tmp/task_prompt.txt").write_text(text + "\n", encoding="utf-8")
          PY
          else
            echo "::error::No task prompt: fill system_prompt.md or set the task_prompt input."
            exit 1
          fi

          if [ ! -s /tmp/task_prompt.txt ] || [ -z "$(tr -d '[:space:]' < /tmp/task_prompt.txt)" ]; then
            echo "::error::Resolved task prompt (from $SOURCE) is empty."
            exit 1
          fi

          {
            echo "prompt<<__TASK_PROMPT_EOF__"
            cat /tmp/task_prompt.txt
            echo "__TASK_PROMPT_EOF__"
          } >> "$GITHUB_OUTPUT"

          echo "Task prompt source: $SOURCE"
          echo "Task prompt ($(wc -c < /tmp/task_prompt.txt) bytes, $(wc -l < /tmp/task_prompt.txt) lines):"
          sed -n '1,8p' /tmp/task_prompt.txt

      - name: Fetch Existing Centralized Storage (Read-Only Context)
        continue-on-error: true
        run: |
          mkdir -p central_memory
          if git fetch origin central-storage 2>/dev/null; then
            git show origin/central-storage:knowledge_base.json > central_memory/knowledge_base.json \
              || echo '{"entries":[]}' > central_memory/knowledge_base.json
          else
            echo '{"entries":[]}' > central_memory/knowledge_base.json
          fi

      - name: Set up Python & Cache Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install openai pydantic

      - name: Reclaim Disk Space for Model Weights
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Cache Ollama Model Weights
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-model-${{ inputs.pareto_model }}

      - name: Install Ollama & Load Pareto Model
        env:
          PARETO_MODEL: ${{ inputs.pareto_model }}
        run: |
          set -euo pipefail
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          export OLLAMA_HOST=127.0.0.1:11434
          export OLLAMA_MAX_LOADED_MODELS=1
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_KEEP_ALIVE=10m
          nohup ollama serve > /tmp/ollama.log 2>&1 &

          echo "Waiting for Ollama readiness..."
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/version > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:11434/api/version || { tail -n 40 /tmp/ollama.log; exit 1; }

          ollama pull "$PARETO_MODEL"
          ollama list

      - name: Execute Agent Reasoning Loop
        env:
          AGENT_ID: ${{ matrix.agent_id }}
          TASK_PROMPT: ${{ steps.task_prompt.outputs.prompt }}
          MODEL_NAME: ${{ inputs.pareto_model }}
          SYSTEM_PROMPTS_PATH: agents/system_prompts.json
          CENTRAL_MEMORY_PATH: central_memory/knowledge_base.json
        run: python agents/run_agent_ollama.py

      - name: Commit Agent Findings to Dedicated Agent Branch
        env:
          AGENT_ID: ${{ matrix.agent_id }}
        run: |
          set -euo pipefail
          git config user.name "agent-${AGENT_ID}[bot]"
          git config user.email "${AGENT_ID}@users.noreply.github.com"

          # One writer per branch: no two runners ever push to the same ref.
          git checkout -B "agent-state/${AGENT_ID}"
          git add -f "output/${AGENT_ID}_finding.json"
          git commit -m "chore(${AGENT_ID}): findings for run ${{ github.run_id }}"
          git push origin "agent-state/${AGENT_ID}" --force

      - name: Upload Findings Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finding-${{ matrix.agent_id }}
          path: output/
          if-no-files-found: ignore

  # =========================================================================
  # JOB 2: Fan-in — single writer merges every agent branch (zero races)
  # =========================================================================
  consolidate-storage:
    needs: run-agents
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: central-storage-writer
      cancel-in-progress: false
    steps:
      - name: Checkout Codebase Tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch All Agent State Branches
        run: |
          set -euo pipefail
          mkdir -p incoming_findings
          AGENTS=$(python3 -c 'import json; print(" ".join(json.load(open("agents/system_prompts.json")).keys()))')
          for agent in $AGENTS; do
            git fetch origin "agent-state/$agent"
            git show "origin/agent-state/$agent:output/${agent}_finding.json" \
              > "incoming_findings/${agent}_finding.json"
          done
          ls -lh incoming_findings/

      - name: Fetch Existing Central Knowledge Base
        continue-on-error: true
        run: |
          mkdir -p central_memory
          if git fetch origin central-storage 2>/dev/null; then
            git show origin/central-storage:knowledge_base.json > central_memory/knowledge_base.json \
              || rm -f central_memory/knowledge_base.json
          else
            echo "No central-storage branch yet -> creating a fresh store."
          fi

      - name: Merge Findings into Central Knowledge Base
        env:
          INCOMING_DIR: incoming_findings
          KB_JSON_PATH: central_memory/knowledge_base.json
          REPORT_PATH: central_memory/SWARM_REPORT.md
        run: python agents/consolidate_json.py

      - name: Push Unified State to Central Storage Branch
        run: |
          set -euo pipefail
          git config user.name "central-storage-merger[bot]"
          git config user.email "merger@users.noreply.github.com"

          git fetch origin central-storage 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/central-storage; then
            git checkout -B central-storage origin/central-storage
          else
            git checkout --orphan central-storage
            git rm -rf --cached . > /dev/null
          fi

          cp central_memory/knowledge_base.json knowledge_base.json
          cp central_memory/SWARM_REPORT.md SWARM_REPORT.md
          git add -f knowledge_base.json SWARM_REPORT.md

          if git diff --cached --quiet; then
            echo "No knowledge-base changes to publish."
          else
            git commit -m "storage: consolidate multi-agent findings (run #${{ github.run_number }})"
            git push origin central-storage
            echo "Published knowledge_base.json + SWARM_REPORT.md to central-storage."
          fi
