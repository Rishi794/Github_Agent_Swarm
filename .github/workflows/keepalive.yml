name: Keepalive & Schedule Self-Heal

# Why this exists
# --------------
# 1. GitHub automatically DISABLES scheduled workflows after 60 days without
#    repository activity. The debate workflow runs every 3 hours and pushes to
#    `agent-state/*` + `central-storage`, which counts as activity - but if the
#    debate is ever paused or failing before it pushes, this weekly heartbeat
#    still resets the timer.
# 2. If a workflow does get auto-disabled (e.g. `disabled_inactivity`), the
#    second step flips it back to `active` through the API.
#
# Repositories are never auto-archived by GitHub (archival is a manual owner
# action), and public repositories use free Actions minutes, so there is no
# billing path that silently turns Actions off. This job covers the one
# automatic disable mechanism that does exist.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write   # heartbeat commit
  actions: write    # re-enable disabled workflows

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Default Branch
        uses: actions/checkout@v4

      - name: Commit Weekly Heartbeat
        run: |
          set -euo pipefail
          git config user.name "keepalive[bot]"
          git config user.email "keepalive@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

          mkdir -p .github
          printf '{\n  "last_heartbeat": "%s",\n  "run_id": "%s",\n  "note": "Weekly heartbeat that keeps GitHub from disabling scheduled workflows for inactivity. Managed automatically - do not delete."\n}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_RUN_ID}" > .github/keepalive.json

          git add .github/keepalive.json
          if git diff --cached --quiet; then
            echo "Heartbeat unchanged; nothing to commit."
          else
            git commit -m "chore(keepalive): heartbeat $(date -u +%Y-%m-%d) [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Heartbeat committed to ${GITHUB_REF_NAME}."
          fi

      - name: Re-enable Any Auto-Disabled Workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "--- workflow states (before) ---"
          gh workflow list --all

          gh workflow list --all --json name,state,path > /tmp/workflows.json
          python3 - <<'PY' > /tmp/disabled.tsv
          import json, pathlib
          for wf in json.loads(pathlib.Path("/tmp/workflows.json").read_text(encoding="utf-8")):
              path = wf.get("path", "")
              if wf.get("state") != "active" and path.startswith(".github/workflows/"):
                  print(f"{wf['name']}\t{path}")
          PY

          if [ ! -s /tmp/disabled.tsv ]; then
            echo "Every workflow is active - nothing to re-enable."
            exit 0
          fi

          while IFS=$'\t' read -r name path; do
            echo "::warning::Re-enabling '$name' ($path)"
            gh api -X PUT \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/$(basename "$path")/enable" \
              || gh workflow enable "$name" || true
          done < /tmp/disabled.tsv

          echo "--- workflow states (after) ---"
          gh workflow list --all

      - name: Summarize
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Keepalive"
            echo ""
            echo "- Heartbeat file: \`.github/keepalive.json\` on \`${GITHUB_REF_NAME}\`"
            echo "- Purpose: resets GitHub's 60-day scheduled-workflow inactivity timer"
            echo "- Workflow states:"
            echo '```'
            gh workflow list --all
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
