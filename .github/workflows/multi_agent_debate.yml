name: Multi-Agent Debate Swarm (llama.cpp + sqlite-vec)

# Fan-out / fan-in topology
#   main              -> orchestration (this file + agents/*.py)
#   agent-state/<id>  -> per-agent, collision-free debate transcript per round
#   central-storage   -> orphan branch holding knowledge_base.db (sqlite-vec) + dashboard
#
# Model configuration is read at runtime from a SEPARATE repository (see `config_repo`),
# so models/flags/rounds can be hot-swapped without touching this codebase.
#
# Agents are tool-enabled: mid-reasoning they may call `search_web`, `query_arxiv`,
# `fetch_url`, and `compute` (see agents/agent_tools.py) before producing each round's
# structured thesis. Everything lands in agentic_results.md on `central-storage`.

on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: 'Problem statement; leave EMPTY to use the task defined in system_prompt.md'
        required: false
        default: ''
      config_repo:
        description: 'External GitHub repository containing model_config.json (owner/repo)'
        required: true
        default: 'Rishi794/Model_Config'
      config_ref:
        description: 'Branch or tag in the external model config repository'
        required: true
        default: 'main'
      rounds_override:
        description: 'Optional: override debate_rounds (leave empty to use model_config.json)'
        required: false
        default: ''
  schedule:
    # Every 3 hours (UTC, on the hour). The mission comes from system_prompt.md.
    # Runs are serialized by the `swarm-debate` concurrency group below, so a slow
    # debate can never overlap the next scheduled one mid-round.
    - cron: '0 */3 * * *'

permissions:
  contents: write

# Serialize whole runs so agent-state branches are never rewritten mid-debate.
concurrency:
  group: swarm-debate
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1: Parallel multi-round debate, one isolated branch per agent
  # =========================================================================
  debate-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        agent_id: [researcher, security_auditor, synthesizer]

    steps:
      - name: Checkout Swarm Execution Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout External Model Configuration Repository
        uses: actions/checkout@v4
        with:
          # `||` fallbacks matter: on a `schedule` event GitHub does NOT apply
          # workflow_dispatch input defaults, so inputs.* would be empty strings.
          repository: ${{ inputs.config_repo || 'Rishi794/Model_Config' }}
          ref: ${{ inputs.config_ref || 'main' }}
          path: external_config
          token: ${{ secrets.CONFIG_REPO_TOKEN || github.token }}

      - name: Resolve Task Prompt (dispatch input > system_prompt.md)
        id: task_prompt
        env:
          INPUT_TASK_PROMPT: ${{ inputs.task_prompt }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TASK_PROMPT//[[:space:]]/}" ]; then
            SOURCE="workflow_dispatch input"
            printf '%s\n' "$INPUT_TASK_PROMPT" > /tmp/task_prompt.txt
          elif [ -f system_prompt.md ]; then
            SOURCE="system_prompt.md"
            # Strip HTML comments so author notes never reach the model.
            python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("system_prompt.md").read_text(encoding="utf-8")
          text = re.sub(r"<!--.*?-->", "", text, flags=re.DOTALL)
          text = re.sub(r"\n{3,}", "\n\n", text).strip()
          pathlib.Path("/tmp/task_prompt.txt").write_text(text + "\n", encoding="utf-8")
          PY
          else
            echo "::error::No task prompt: fill system_prompt.md or set the task_prompt input."
            exit 1
          fi

          if [ ! -s /tmp/task_prompt.txt ] || [ -z "$(tr -d '[:space:]' < /tmp/task_prompt.txt)" ]; then
            echo "::error::Resolved task prompt (from $SOURCE) is empty."
            exit 1
          fi

          {
            echo "prompt<<__TASK_PROMPT_EOF__"
            cat /tmp/task_prompt.txt
            echo "__TASK_PROMPT_EOF__"
          } >> "$GITHUB_OUTPUT"

          echo "Task prompt source: $SOURCE"
          PROMPT_BYTES=$(wc -c < /tmp/task_prompt.txt)
          EST_TOKENS=$((PROMPT_BYTES / 4))
          CTX=$(python3 -c 'import json;print(json.load(open("external_config/model_config.json"))["llama_server_flags"]["ctx_size"])')
          echo "Task prompt: ${PROMPT_BYTES} bytes, ~${EST_TOKENS} tokens (model ctx_size=${CTX})"
          if [ "$EST_TOKENS" -gt "$((CTX / 2))" ]; then
            echo "::warning::system_prompt.md is ~${EST_TOKENS} tokens but ctx_size is ${CTX}; RAG context, peer findings and tool results may overflow the window. Raise ctx_size in Model_Config or shorten the prompt."
          fi
          sed -n '1,8p' /tmp/task_prompt.txt

      - name: Configure 4GB Swap & Reclaim Disk Space (OOM Guard)
        run: |
          set -euo pipefail
          echo "--- memory before ---"; free -m
          echo "--- disk before ---"; df -h /
          echo "--- active swap before ---"; swapon --show || true

          # Preinstalled toolchains the model never needs (~20 GB back).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

          # An *active* swap file cannot be deleted — rm returns EPERM even as root —
          # so disable it first, then rebuild a 4 GB file. Swap housekeeping must never
          # kill the run: if any of this fails, keep going with whatever swap exists.
          if sudo swapoff /swapfile 2>/dev/null; then
            if sudo rm -f /swapfile \
              && { sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none; } \
              && sudo chmod 600 /swapfile \
              && sudo mkswap /swapfile \
              && sudo swapon /swapfile; then
              echo "Swap rebuilt: 4G at /swapfile."
            else
              echo "::warning::Could not rebuild /swapfile after swapoff; this job runs without swap."
            fi
          else
            echo "No active /swapfile to rebuild (the runner manages swap elsewhere); keeping existing swap."
          fi

          sudo sysctl vm.swappiness=10
          echo "--- swap after ---"; swapon --show || true
          echo "--- memory after ---"; free -m
          echo "--- disk after ---"; df -h /

      - name: Fetch Persistent sqlite-vec Database from Central Storage
        continue-on-error: true
        run: |
          mkdir -p central_memory
          if git fetch origin central-storage 2>/dev/null; then
            git show origin/central-storage:knowledge_base.db > central_memory/knowledge_base.db \
              || rm -f central_memory/knowledge_base.db
            ls -lh central_memory/ || true
          else
            echo "No central-storage branch yet -> starting with empty vector memory."
          fi

      - name: Parse External Model Config
        id: model_cfg
        env:
          ROUNDS_OVERRIDE: ${{ inputs.rounds_override }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          with open("external_config/model_config.json", encoding="utf-8") as fh:
              cfg = json.load(fh)
          flags = cfg["llama_server_flags"]
          rounds = os.environ.get("ROUNDS_OVERRIDE") or cfg.get("debate_rounds", 2)
          cache_key = f"{cfg['hf_repo']}-{cfg['hf_file']}".replace("/", "-")
          print(
              f"configured model: {cfg['hf_repo']}/{cfg['hf_file']} "
              f"alias={cfg['model_alias']} rounds={rounds} "
              f"tools={cfg.get('enable_tools', True)} "
              f"tool_budget={cfg.get('max_tool_iterations', 3)}",
              file=sys.stderr,
          )
          print(f"hf_repo={cfg['hf_repo']}")
          print(f"hf_file={cfg['hf_file']}")
          print(f"model_alias={cfg['model_alias']}")
          print(f"rounds={rounds}")
          print(f"llama_cpp_release={cfg.get('llama_cpp_release', 'auto')}")
          print(f"cache_key=llama-{cache_key}-{cfg.get('llama_cpp_release', 'auto')}")
          print(
              "flags="
              f"-t {flags['threads']} -tb {flags['threads_batch']} -c {flags['ctx_size']} "
              f"-b {flags['batch_size']} -ub {flags['ubatch_size']} -np {flags['parallel_slots']} "
              f"-ctk {flags['cache_type_k']} -ctv {flags['cache_type_v']} "
              f"-lm {flags['load_mode']} -fa {flags['flash_attn']}"
          )
          PY

      - name: Set up Python & Cache Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Packages
        run: pip install -r requirements.txt

      - name: Run Pre-LLM Vector RAG Search (Isolated Process to Save RAM)
        env:
          TASK_PROMPT: ${{ steps.task_prompt.outputs.prompt }}
          CONFIG_PATH: external_config/model_config.json
          KB_DB_PATH: central_memory/knowledge_base.db
          RAG_CONTEXT_PATH: /tmp/rag_context.json
        run: python agents/rag_query.py

      - name: Cache GGUF Weights, llama.cpp Binaries & Embedding Weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gguf_models
            ~/.cache/llama_bin
            ~/.cache/fastembed
          key: ${{ steps.model_cfg.outputs.cache_key }}

      - name: Download Prebuilt llama-server & GGUF Weights
        env:
          GH_TOKEN: ${{ github.token }}
          HF_REPO: ${{ steps.model_cfg.outputs.hf_repo }}
          HF_FILE: ${{ steps.model_cfg.outputs.hf_file }}
          LLAMA_CPP_RELEASE: ${{ steps.model_cfg.outputs.llama_cpp_release }}
        run: |
          set -euo pipefail
          BIN_DIR="$HOME/.cache/llama_bin"
          MODEL_DIR="$HOME/.cache/gguf_models"
          mkdir -p "$BIN_DIR" "$MODEL_DIR"

          if [ ! -x "$BIN_DIR/llama-server" ]; then
            echo "Resolving llama.cpp Linux x64 CPU build (requested: $LLAMA_CPP_RELEASE) ..."
            ASSET_URL=$(python3 - <<'PY'
          import json, os, urllib.request

          TOKEN = os.environ.get("GH_TOKEN", "")
          WANTED = os.environ.get("LLAMA_CPP_RELEASE", "auto").strip()
          SUFFIX = "bin-ubuntu-x64.tar.gz"   # plain CPU build (no cuda/rocm/vulkan/sycl/openvino)


          def api(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "User-Agent": "multi-agent-swarm-setup",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)


          def asset_for(release):
              for asset in release.get("assets", []):
                  name = asset["name"]
                  if name.endswith(SUFFIX) and "cudart" not in name:
                      return asset["browser_download_url"]
              return None


          url = None
          if WANTED and WANTED.lower() != "auto":
              url = asset_for(api(f"https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/{WANTED}"))
              if url is None:
                  raise SystemExit(f"No {SUFFIX} asset found for pinned release {WANTED}")
          else:
              releases = api("https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=40")
              for release in releases:
                  url = asset_for(release)
                  if url:
                      print(f"# using {release['tag_name']}", file=os.sys.stderr)
                      break
              if url is None:
                  raise SystemExit("No Linux x64 CPU llama.cpp build found in the last 40 releases")

          print(url)
          PY
          )
            curl -fL "$ASSET_URL" -o /tmp/llama.tar.gz
            # Tarballs contain a single top-level directory (llama-bXXXXX/) with all libs + bins.
            tar -xzf /tmp/llama.tar.gz -C "$BIN_DIR" --strip-components=1
            chmod +x "$BIN_DIR/llama-server"
            rm -f /tmp/llama.tar.gz
          fi
          "$BIN_DIR/llama-server" --version | head -n 5

          if [ ! -f "$MODEL_DIR/$HF_FILE" ]; then
            echo "Downloading $HF_REPO/$HF_FILE ..."
            if command -v hf >/dev/null 2>&1; then
              hf download "$HF_REPO" "$HF_FILE" --local-dir "$MODEL_DIR"
            else
              huggingface-cli download "$HF_REPO" "$HF_FILE" --local-dir "$MODEL_DIR"
            fi
          fi
          ls -lh "$MODEL_DIR"

      - name: Boot CPU-Optimized llama-server & Execute Multi-Round Debate
        env:
          AGENT_ID: ${{ matrix.agent_id }}
          TASK_PROMPT: ${{ steps.task_prompt.outputs.prompt }}
          ALL_AGENTS: "researcher,security_auditor,synthesizer"
          ROUNDS_OVERRIDE: ${{ inputs.rounds_override }}
          CONFIG_PATH: external_config/model_config.json
          SYSTEM_PROMPTS_PATH: agents/system_prompts.json
          RAG_CONTEXT_PATH: /tmp/rag_context.json
          LLAMA_BASE_URL: http://127.0.0.1:8080/v1
          LLAMA_FLAGS: ${{ steps.model_cfg.outputs.flags }}
          HF_FILE: ${{ steps.model_cfg.outputs.hf_file }}
          MODEL_ALIAS: ${{ steps.model_cfg.outputs.model_alias }}
          MAX_TOOL_RESULT_CHARS: "6000"
        run: |
          set -euo pipefail
          BIN_DIR="$HOME/.cache/llama_bin"
          MODEL_DIR="$HOME/.cache/gguf_models"
          # Prebuilt libs live next to the binary; keep the dynamic loader pointed at them.
          export LD_LIBRARY_PATH="$BIN_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          git config user.name "agent-${AGENT_ID}[bot]"
          git config user.email "${AGENT_ID}@users.noreply.github.com"

          # Single model load for ALL debate rounds: llama-server stays warm while the
          # runner loops through rounds and synchronizes via git branches.
          # --jinja enables the model's real chat template, which is what makes
          # native tool calling (search_web / query_arxiv / fetch_url / compute) work.
          # shellcheck disable=SC2086  # LLAMA_FLAGS must word-split into separate CLI args.
          "$BIN_DIR/llama-server" \
            -m "$MODEL_DIR/$HF_FILE" \
            --alias "$MODEL_ALIAS" \
            --host 127.0.0.1 --port 8080 \
            --jinja \
            $LLAMA_FLAGS \
            > /tmp/llama-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          echo "Waiting for llama-server readiness..."
          READY=0
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::llama-server exited during startup"
              tail -n 80 /tmp/llama-server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::llama-server did not become healthy within 180s"
            tail -n 80 /tmp/llama-server.log
            exit 1
          fi
          echo "llama-server healthy (pid $SERVER_PID). Memory:"; free -m

          python agents/debate_runner.py
          echo "--- server log tail ---"
          tail -n 20 /tmp/llama-server.log

      - name: Upload Debate Round Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debate-output-${{ matrix.agent_id }}
          path: output/
          if-no-files-found: ignore

  # =========================================================================
  # JOB 2: Fan-in — consolidate every round into the persistent sqlite-vec
  #        knowledge base on the central-storage branch (single writer)
  # =========================================================================
  consolidate-sqlite-storage:
    needs: debate-agents
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # Guarantees a single writer per branch, so pushes never conflict.
      group: central-storage-writer
      cancel-in-progress: false
    steps:
      - name: Checkout Swarm Execution Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout External Model Configuration Repository
        uses: actions/checkout@v4
        with:
          # `||` fallbacks matter: on a `schedule` event GitHub does NOT apply
          # workflow_dispatch input defaults, so inputs.* would be empty strings.
          repository: ${{ inputs.config_repo || 'Rishi794/Model_Config' }}
          ref: ${{ inputs.config_ref || 'main' }}
          path: external_config
          token: ${{ secrets.CONFIG_REPO_TOKEN || github.token }}

      - name: Set up Python & Cache Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Packages
        run: pip install -r requirements.txt

      - name: Collect All Debate Round Outputs from Agent Branches
        env:
          ROUNDS_OVERRIDE: ${{ inputs.rounds_override }}
        run: |
          set -euo pipefail
          mkdir -p incoming_findings
          ROUNDS=$(python3 -c 'import json, os; print(os.environ.get("ROUNDS_OVERRIDE") or json.load(open("external_config/model_config.json"))["debate_rounds"])')
          AGENTS=$(python3 -c 'import json; print(" ".join(json.load(open("agents/system_prompts.json")).keys()))')
          echo "Collecting rounds=$ROUNDS for agents: $AGENTS"
          for agent in $AGENTS; do
            git fetch origin "agent-state/$agent"
            for r in $(seq 1 "$ROUNDS"); do
              git show "origin/agent-state/$agent:output/round_${r}.json" \
                > "incoming_findings/round_${r}_${agent}.json"
            done
          done
          ls -lh incoming_findings/

      - name: Fetch Existing Knowledge Base from Central Storage
        continue-on-error: true
        run: |
          mkdir -p central_memory
          if git fetch origin central-storage 2>/dev/null; then
            git show origin/central-storage:knowledge_base.db > central_memory/knowledge_base.db \
              || rm -f central_memory/knowledge_base.db
            ls -lh central_memory/ || true
          else
            echo "No central-storage branch yet -> creating a fresh knowledge base."
          fi

      - name: Embed Findings & Update sqlite-vec Database
        env:
          CONFIG_PATH: external_config/model_config.json
          INCOMING_DIR: incoming_findings
          KB_DB_PATH: central_memory/knowledge_base.db
          REPORT_PATH: central_memory/README.md
          AGENTIC_REPORT_PATH: central_memory/agentic_results.md
        run: python agents/consolidate_sqlite.py

      - name: Publish Database & Reports to Central Storage Branch
        run: |
          set -euo pipefail
          git config user.name "sqlite-vec-merger[bot]"
          git config user.email "merger@users.noreply.github.com"

          git fetch origin central-storage 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/central-storage; then
            git checkout -B central-storage origin/central-storage
          else
            git checkout --orphan central-storage
            git rm -rf --cached . > /dev/null
          fi

          cp central_memory/knowledge_base.db knowledge_base.db
          cp central_memory/README.md README.md
          cp central_memory/agentic_results.md agentic_results.md
          git add -f knowledge_base.db README.md agentic_results.md

          if git diff --cached --quiet; then
            echo "No knowledge-base changes to publish."
          else
            git commit -m "storage(sqlite-vec): index debate findings + agentic_results.md (run #${{ github.run_number }})"
            git push origin central-storage
            echo "Published knowledge_base.db, agentic_results.md and README.md to central-storage."
          fi
